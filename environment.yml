name: neuroflow-diagnostics
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  # PyTorch & GPU
  - pytorch::pytorch::=2.1.2
  - pytorch::pytorch-cuda=12.1
  - pytorch::torchvision::=0.16.2
  - pytorch::torchaudio::=2.1.2
  
  # PyTorch Geometric
  - pyg::pytorch-geometric=2.4.0
  - pyg::pyg-lib
  - pyg::pytorch-scatter
  - pyg::pytorch-sparse
  - pyg::pytorch-cluster
  - pyg::pytorch-spline-conv
  
  # Core Python
  - python=3.10
  - pip
  
  # Scientific Stack
  - numpy=1.24.3
  - scipy=1.11.4
  - scikit-learn=1.3.2
  - pandas=2.1.3
  - matplotlib=3.8.2
  - seaborn=0.13.0
  
  # File I/O
  - h5py=3.10.0
  - pyyaml=6.0.1
  
  # Utilities
  - tqdm=4.66.1
  - jupyter=1.0.0
  - ipython=8.18.1
  
  # Development
  - pytest=7.4.3
  - black=23.12.0
  - mypy=1.7.1

  - pip:
    - pytorch-lightning==2.1.3
    - plotly==5.18.0
    - trimesh==4.0.4
    - pyvista==0.43.0
    - nibabel==5.1.0
    - tensorboard==2.15.1
    - wandb==0.16.1
    - pytest-cov==4.1.0
    - flake8==6.1.0
    - pydantic==2.5.2
    - attrs==23.2.0

# Environment variables to set:
variables:
  CUDA_VISIBLE_DEVICES: "0"  # Adjust for your GPU
  PYTHONHASHSEED: "42"
  TF_CPP_MIN_LOG_LEVEL: "3"  # Suppress TensorFlow warnings
